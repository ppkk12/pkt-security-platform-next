services:
  postgres:
    image: postgres:16-alpine
    container_name: pkt-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pktsecurity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pktsecurity"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PktSecurity.Api/Dockerfile
    container_name: pkt-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pktsecurity;Username=postgres;Password=postgres
      - Jwt__Issuer=PktSecurity
      - Jwt__Audience=PktSecurityUsers
      - Jwt__Key=PktSecuritySuperSecretKeyThatIsAtLeast32BytesLong!
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/PktSecurity.Worker/Dockerfile
    container_name: pkt-worker
    restart: always
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pktsecurity;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
